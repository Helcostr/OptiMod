# Custom suspicious alphabet — source of truth for compile-time bitmap tables.
# Edit this file; run `cargo build -p cm-alphabet` to regenerate lookup tables.
#
# Schema per [[char]] entry:
#   codepoint — Unicode scalar (hex), sorted ascending in this file
#   normal    — canonical ASCII letter after mapping
#   category  — documentary grouping only (ipa_small_cap / phonetic_small_cap / latin_ext_d_small_cap)
#
# This is a selective homoglyph set for chat obfuscation, not a full a–z alphabet.


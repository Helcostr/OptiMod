[workspace]
resolver = "2"
members = [
    "crates/cm-core",
    "crates/cm-normalize",
    "crates/cm-alphabet",
    "crates/cm-english",
    "crates/small-caps-obfuscation-plugin",
    "crates/cm-fixture-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
optimod-plugin-sdk = { path = "../../sdk/rust/optimod-plugin-sdk" }
cm-core = { path = "crates/cm-core" }
cm-normalize = { path = "crates/cm-normalize" }
cm-alphabet = { path = "crates/cm-alphabet" }
cm-english = { path = "crates/cm-english" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
unicode-normalization = "0.1"

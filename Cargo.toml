[workspace]
resolver = "2"
members = [
    ".",
    "crates/optimod-checker",
    "sdk/rust/optimod-plugin-sdk",
    "plugins/small-caps-obfuscation/crates/cm-core",
    "plugins/small-caps-obfuscation/crates/cm-normalize",
    "plugins/small-caps-obfuscation/crates/cm-alphabet",
    "plugins/small-caps-obfuscation/crates/cm-english",
    "plugins/small-caps-obfuscation/crates/small-caps-obfuscation-plugin",
    "plugins/small-caps-obfuscation/crates/cm-fixture-runner",
    "plugins/damsel-in-distress/crates/damsel-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
optimod-plugin-sdk = { path = "sdk/rust/optimod-plugin-sdk" }
optimod-checker = { path = "crates/optimod-checker" }
cm-core = { path = "plugins/small-caps-obfuscation/crates/cm-core" }
cm-normalize = { path = "plugins/small-caps-obfuscation/crates/cm-normalize" }
cm-alphabet = { path = "plugins/small-caps-obfuscation/crates/cm-alphabet" }
cm-english = { path = "plugins/small-caps-obfuscation/crates/cm-english" }
damsel-core = { path = "plugins/damsel-in-distress/crates/damsel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
unicode-normalization = "0.1"

[package]
name = "secure-twitch-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
optimod-checker = { workspace = true, features = ["small_caps_obfuscation", "damsel_in_distress", "dll"] }
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.11", features = ["json", "native-tls"] }
futures-util = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros"] }
thiserror = "1.0"
anyhow = "1.0"
unicode-security = "0.1"
unicode-normalization = "0.1"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
